<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="LexUP.png">
<title>LEX UP</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: #f4f4f4;
        font-family: Arial, Helvetica, sans-serif;
    }
    .app {
        width: min(900px, 92%);
        margin: 0 auto;
        padding: 55px 0 80px;
    }
    .hidden { display: none !important; }

    header {
        text-align: center;
        margin-bottom: 38px;
    }
    h1 {
        margin: 0 0 10px;
        font-size: clamp(34px, 6vw, 54px);
        letter-spacing: 3px;
        color: #35e66b;
        text-shadow:
            0 0 5px rgba(53,230,107,.9),
            0 0 14px rgba(53,230,107,.75),
            0 0 30px rgba(53,230,107,.5),
            0 0 55px rgba(53,230,107,.3);
        font-weight: 900;
    }
    .subtitle {
        color: #9b9b9b;
        font-size: 15px;
    }

    .menu {
        display: grid;
        gap: 18px;
        max-width: 700px;
        margin: 0 auto;
    }
    .content-btn {
        text-transform: uppercase;
        width: 100%;
        min-height: 82px;
        border: 1px solid rgba(70, 230, 110, .65);
        border-radius: 16px;
        background: rgba(22, 117, 58, .48);
        color: white;
        font-size: 17px;
        font-weight: 700;
        padding: 18px 24px;
        cursor: pointer;
        text-align: left;
        transition: .18s ease;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        box-shadow: inset 0 1px 0 rgba(120,255,150,.10);
    }
    .content-btn:hover {
        background: rgba(28, 139, 70, .62);
        border-color: rgba(85, 245, 125, .85);
        transform: translateY(-2px);
        box-shadow:
            0 8px 25px rgba(23,117,58,.22),
            inset 0 1px 0 rgba(140,255,165,.14);
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 24px;
    }
    .back {
        border: 1px solid #333;
        background: #111;
        color: #ddd;
        border-radius: 10px;
        padding: 10px 15px;
        cursor: pointer;
    }
    .counter {
        position: fixed;
        top: 18px;
        right: 22px;
        background: #111;
        border: 1px solid #292929;
        border-radius: 12px;
        padding: 10px 15px;
        font-weight: 700;
        z-index: 5;
        box-shadow: 0 5px 20px rgba(0,0,0,.35);
    }
    .topic {
        color: #5bd477;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .8px;
    }

    .question-card {
        background: #0d0d0d;
        border: 1px solid #242424;
        border-radius: 18px;
        padding: 30px;
        margin-top: 12px;
        box-shadow: 0 10px 35px rgba(0,0,0,.3);
    }
    .question-number {
        color: #777;
        font-size: 13px;
        margin-bottom: 14px;
    }
    .statement {
        font-size: 19px;
        line-height: 1.55;
        font-weight: 600;
        margin-bottom: 24px;
    }
    .option {
        width: 100%;
        display: block;
        text-align: left;
        background: #151515;
        color: #eee;
        border: 1px solid #303030;
        border-radius: 12px;
        padding: 16px 18px;
        margin: 10px 0;
        cursor: pointer;
        font-size: 16px;
        line-height: 1.4;
        transition: .15s ease;
    }
    .option:hover:not(:disabled) {
        border-color: #4e4e4e;
        background: #1b1b1b;
    }
    .option.correct {
        background: #155c2d;
        border-color: #35bb5e;
        color: #fff;
    }
    .option.wrong {
        background: #651d24;
        border-color: #e0525e;
        color: #fff;
    }
    .option:disabled { cursor: default; }

    .feedback {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 10px;
        font-weight: 700;
    }
    .feedback.ok {
        background: #103d20;
        color: #72e18d;
        border: 1px solid #236b38;
    }
    .feedback.no {
        background: #42151a;
        color: #ff8a92;
        border: 1px solid #7a2931;
    }
    .next {
        margin-top: 18px;
        border: 0;
        border-radius: 11px;
        background: #16753a;
        color: white;
        padding: 13px 20px;
        font-weight: 700;
        cursor: pointer;
    }
    .next:hover { background: #1c8b46; }

    .result {
        text-align: center;
        padding: 45px 20px;
    }
    .score {
        font-size: 42px;
        color: #5bd477;
        font-weight: 800;
        margin: 15px 0;
    }

    .subject-btn { min-height: 88px; font-size: 19px; }
    .subject-btn .arrow { float: right; opacity: .7; }
    .menu-title { text-align:center; color:#aaa; font-size:14px; margin:-18px 0 20px; text-transform:uppercase; letter-spacing:1px; }
    .errors { margin-top:28px; text-align:left; }
    .errors h3 { color:#ff5a64; margin:0 0 14px; font-size:18px; }
    .error-item { background:#210d10; border:1px solid #6e2028; border-radius:12px; padding:15px 17px; margin:12px 0; color:#fff; }
    .error-q { font-weight:700; line-height:1.5; margin-bottom:9px; }
    .error-selected { color:#ff6b73; font-weight:700; }
    .error-correct { color:#71e18d; margin-top:6px; }
    .empty-errors { color:#72e18d; font-weight:700; margin-top:24px; }


/* LEX UP — atualização visual responsiva */
:root { color-scheme: dark; --accent:#4ade80; --accent2:#16a34a; --panel:#101713; --line:#26372b; --muted:#9aa79e; }
body {
  background:
    radial-gradient(ellipse at 50% -12%, rgba(34,197,94,.17), transparent 48%),
    radial-gradient(ellipse at 0% 100%, rgba(22,101,52,.12), transparent 42%),
    #070a08;
  color:#eef7f0;
}
.app { width:min(1040px,94%); padding:clamp(28px,5vw,62px) 0 80px; }
header { margin-bottom:42px; }
h1 { color:#d9ffe3; text-shadow:0 0 12px rgba(74,222,128,.32); letter-spacing:clamp(3px,.8vw,8px); }
.subtitle { color:#9db5a4; letter-spacing:2.4px; font-size:12px; font-weight:700; }
.menu-title { color:#83a58d; letter-spacing:2px; font-size:11px; font-weight:800; margin:0 0 18px; }
.menu { max-width:790px; gap:13px; }
.content-btn {
  position:relative; min-height:78px; border:1px solid #24432e; border-radius:17px;
  background:linear-gradient(120deg,rgba(18,48,29,.92),rgba(13,23,17,.96));
  box-shadow:0 8px 25px rgba(0,0,0,.16),inset 0 1px rgba(255,255,255,.035);
  font-size:15px; letter-spacing:.35px; line-height:1.4;
}
.content-btn:hover { background:linear-gradient(120deg,rgba(24,76,42,.98),rgba(15,34,22,.98)); border-color:#4ade80; box-shadow:0 12px 28px rgba(34,197,94,.1); }
.subject-btn { min-height:90px; font-size:17px; padding-right:54px; }
.subject-btn .arrow { color:var(--accent); font-size:23px; }
.back { border:1px solid #2b3d30; background:#101812; color:#d8e8dc; border-radius:11px; padding:11px 15px; font-weight:700; transition:.15s; }
.back:hover { border-color:#4ade80; color:#fff; }
.topbar { align-items:center; margin-bottom:26px; }
.topic { color:#72e39a; font-size:12px; letter-spacing:1.2px; line-height:1.5; }
.counter { top:14px; right:14px; background:rgba(12,19,14,.95); border-color:#2c4734; color:#bdf6cc; border-radius:12px; font-size:12px; padding:10px 13px; }
.question-card { background:linear-gradient(145deg,#101612,#0b0f0c); border:1px solid #263a2c; border-radius:20px; padding:clamp(18px,3vw,32px); box-shadow:0 18px 45px rgba(0,0,0,.22); }
.question-number { color:#8ca294; text-transform:uppercase; letter-spacing:1.2px; font-size:11px; font-weight:800; }
.statement { font-size:clamp(17px,2.2vw,20px); line-height:1.6; font-weight:650; }
.option { background:#141b16; border:1px solid #2b3930; border-radius:13px; padding:15px 17px; }
.option:hover:not(:disabled) { border-color:#4ade80; background:#17251b; }
.option.correct { background:#123b22; border-color:#3dcf71; }
.option.wrong { background:#431a20; border-color:#e0525e; }
.feedback { line-height:1.55; }
.next { background:linear-gradient(135deg,#15803d,#166534); border:1px solid #32884c; border-radius:12px; padding:13px 18px; margin-right:8px; }
.next:hover { background:linear-gradient(135deg,#16a34a,#15803d); }
.prev { background:linear-gradient(135deg,#1e3a2a,#163024); border:1px solid #3d5c48; border-radius:12px; padding:13px 18px; margin-right:8px; color:#d4e8d9; font-weight:700; cursor:pointer; }
.prev:hover { background:linear-gradient(135deg,#254a35,#1a3a2a); border-color:#4ade80; color:#fff; }
.prev:disabled { opacity:.4; cursor:default; }
.nav-buttons { margin-top:18px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.skip { margin-top:18px; border:1px solid #4b5a4f; background:#171d19; color:#d4e1d7; border-radius:11px; padding:12px 17px; font-weight:750; cursor:pointer; }
.skip:hover { border-color:#9bb9a2; background:#202b23; }
.study-summary { margin:0 0 14px; border:1px solid #294332; border-radius:15px; background:rgba(15,26,18,.92); overflow:hidden; }
.study-summary summary { cursor:pointer; list-style:none; padding:14px 17px; color:#a8efba; font-size:12px; font-weight:800; letter-spacing:1px; }
.study-summary summary::-webkit-details-marker { display:none; }
.study-summary summary:after { content:"＋"; float:right; color:#4ade80; font-size:16px; }
.study-summary[open] summary:after { content:"−"; }
.study-summary .summary-body { padding:0 18px 16px; color:#c7d4ca; font-size:14px; line-height:1.7; }
.study-summary p { margin:10px 0; }
.result { padding-top:38px; }
.score { color:#8df2a8; text-shadow:0 0 22px rgba(74,222,128,.12); }
.result-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:24px 0; }
.stat { background:#121a14; border:1px solid #2b3e30; border-radius:13px; padding:13px 8px; }
.stat strong { display:block; font-size:23px; color:#d9ffe3; margin-bottom:4px; }
.stat span { font-size:10px; color:#9caf9f; text-transform:uppercase; letter-spacing:.7px; }
.skipped-item { background:#171a16; border:1px solid #4a4931; border-radius:12px; padding:14px 16px; margin:10px 0; color:#e9e4bf; line-height:1.5; }
.errors h3 { letter-spacing:.8px; }
.error-item { background:#210f12; }
@media(max-width:600px) {
  .app { width:92%; padding-top:66px; }
  .topbar { align-items:flex-start; flex-direction:column; }
  .counter { top:8px; right:8px; max-width:90%; font-size:10px; }
  .subject-btn { font-size:15px; min-height:76px; }
  .question-card { border-radius:16px; }
  .result-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
}


/* Flashcards */
.fc-card {
  background: linear-gradient(145deg, #101612, #0b0f0c);
  border: 1px solid #263a2c;
  border-radius: 20px;
  padding: clamp(24px, 4vw, 40px);
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 18px 45px rgba(0,0,0,.22);
  transition: border-color .15s;
  user-select: none;
}
.fc-card:hover { border-color: #4ade80; }
.fc-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: #8ca294;
  margin-bottom: 16px;
}
.fc-text {
  font-size: clamp(17px, 2.4vw, 21px);
  line-height: 1.55;
  font-weight: 600;
  color: #eef7f0;
}
.fc-hint {
  margin-top: 22px;
  font-size: 12px;
  color: #6b8a72;
  font-weight: 600;
}
.fc-back .fc-label { color: #72e39a; }
.fc-back .fc-text { color: #d9ffe3; font-weight: 500; font-size: clamp(15px, 2vw, 18px); }
.fc-nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
  align-items: center;
}
.fc-btn {
  border: 1px solid #2b3d30;
  background: #101812;
  color: #d8e8dc;
  border-radius: 11px;
  padding: 12px 16px;
  font-weight: 700;
  cursor: pointer;
  font-size: 14px;
  transition: .15s;
}
.fc-btn:hover { border-color: #4ade80; color: #fff; }
.fc-btn.primary {
  background: linear-gradient(135deg, #15803d, #166534);
  border-color: #32884c;
  color: #fff;
}
.fc-btn.primary:hover { background: linear-gradient(135deg, #16a34a, #15803d); }
.fc-progress {
  margin-left: auto;
  font-size: 13px;
  color: #9caf9f;
  font-weight: 700;
}
.fc-mode-btns {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

</style>
</head>
<body>
<div class="counter hidden" id="counter">0/0</div>

<main class="app">
    <section id="home">
        <header>
            <h1>LEX UP</h1>
            <div class="subtitle">ESCOLHA A MATÉRIA</div>
        </header>
        <div class="menu-title">DISCIPLINAS</div>
        <div class="menu" id="menu"></div>
    </section>

    <section id="subjectMenu" class="hidden">
        <div class="topbar">
            <button class="back" onclick="goHome()">← MATÉRIAS</button>
            <div class="topic" id="subjectTitle"></div>
        </div>
        <div class="menu-title">BLOCOS DE QUESTÕES</div>
        <div class="menu" id="blockMenu"></div>
    </section>

    <section id="quiz" class="hidden">
        <div class="topbar">
            <button class="back" onclick="goBlockMenu()">← BLOCOS</button>
            <div class="topic" id="topic"></div>
        </div>

        <div id="questionArea"></div>
    </section>

    <section id="flashcards" class="hidden">
        <div class="topbar">
            <button class="back" id="fcBackBtn">← VOLTAR</button>
            <div class="topic" id="fcTopic">FLASHCARDS — DIREITO CONSTITUCIONAL</div>
        </div>
        <div class="fc-mode-btns">
            <button class="fc-btn" id="fcShuffleBtn">EMBARALHAR</button>
            <button class="fc-btn" id="fcResetBtn">RECOMEÇAR</button>
        </div>
        <div id="fcArea"></div>
    </section>

</main>

<script>
const contents = [
    {
        "name": "A — Norma Penal: conceito, características e princípios",
        "questions": [
            {
                "q": "O princípio da legalidade penal, previsto no art. 5º, XXXIX, da CF e no art. 1º do CP, impede que",
                "options": [
                    "a lei penal mais benéfica retroaja para beneficiar o réu.",
                    "a criação de crimes e penas ocorra por lei anterior ao fato.",
                    "a interpretação judicial seja utilizada para criar novos tipos penais.",
                    "o legislador estabeleça crimes e penas mediante lei."
                ],
                "answer": 2
            },
            {
                "q": "A reserva legal, no Direito Penal, significa que",
                "options": [
                    "todo ilícito deve ser previsto em decreto regulamentar.",
                    "qualquer ato administrativo pode criar sanção penal.",
                    "a jurisprudência vinculante substitui a lei penal.",
                    "a matéria de crimes e penas deve ser disciplinada por lei."
                ],
                "answer": 3
            },
            {
                "q": "Em matéria penal, a analogia in malam partem é vedada porque",
                "options": [
                    "a analogia é proibida em qualquer ramo jurídico.",
                    "somente o Ministério Público pode fazer analogia.",
                    "a analogia sempre beneficia o acusado.",
                    "não pode ser utilizada para prejudicar o acusado mediante criação ou ampliação de incriminação."
                ],
                "answer": 3
            },
            {
                "q": "A interpretação extensiva distingue-se da analogia porque",
                "options": [
                    "na interpretação extensiva o sentido já contido na norma é alcançado; na analogia há integração de lacuna.",
                    "a interpretação extensiva é sempre proibida no Direito Penal.",
                    "a analogia interpreta literalmente e a extensiva cria norma nova.",
                    "ambas criam novos crimes indistintamente."
                ],
                "answer": 0
            },
            {
                "q": "O princípio da intervenção mínima relaciona-se à ideia de que o Direito Penal",
                "options": [
                    "deve atuar como instrumento de ultima ratio, reservado a lesões relevantes a bens jurídicos.",
                    "deve incidir mesmo sem lesão ou perigo relevante.",
                    "deve substituir os demais ramos do Direito.",
                    "deve punir toda conduta moralmente reprovável."
                ],
                "answer": 0
            },
            {
                "q": "O princípio da fragmentariedade indica que",
                "options": [
                    "somente crimes tentados podem ser punidos.",
                    "todos os bens jurídicos recebem proteção penal integral.",
                    "o Direito Penal protege apenas parcelas especialmente relevantes dos bens jurídicos, contra determinadas condutas.",
                    "toda violação civil constitui crime."
                ],
                "answer": 2
            },
            {
                "q": "A ofensividade ou lesividade, em sua formulação clássica, exige que",
                "options": [
                    "a pena seja aplicada sem conduta exteriorizada.",
                    "a intervenção penal esteja relacionada a lesão ou perigo de lesão a bem jurídico.",
                    "a culpabilidade seja presumida pelo resultado.",
                    "todo pensamento perigoso seja criminalizado."
                ],
                "answer": 1
            },
            {
                "q": "A culpabilidade, como princípio limitador do poder punitivo, afasta, em regra,",
                "options": [
                    "a análise da imputabilidade.",
                    "a individualização da pena.",
                    "a necessidade de dolo ou culpa.",
                    "a responsabilidade penal objetiva."
                ],
                "answer": 3
            },
            {
                "q": "O princípio da personalidade da pena significa que",
                "options": [
                    "toda consequência econômica do crime é pessoalmente intransferível.",
                    "a pena não pode ultrapassar a pessoa do condenado, sem prejuízo da responsabilidade civil nos termos constitucionais.",
                    "a família do condenado responde penalmente por ele.",
                    "a pena pode ser executada contra sucessores."
                ],
                "answer": 1
            },
            {
                "q": "A individualização da pena exige",
                "options": [
                    "afastamento obrigatório da discricionariedade judicial.",
                    "pena idêntica para todos os crimes do mesmo tipo.",
                    "consideração das peculiaridades do fato e do agente nas etapas constitucionalmente previstas.",
                    "aplicação automática da pena mínima."
                ],
                "answer": 2
            },
            {
                "q": "A dignidade da pessoa humana, em matéria penal, funciona como",
                "options": [
                    "fundamento e limite ao exercício do poder punitivo estatal.",
                    "autorização para abolir qualquer pena.",
                    "regra que impede toda prisão cautelar.",
                    "princípio restrito ao Direito Civil."
                ],
                "answer": 0
            },
            {
                "q": "A norma penal incriminadora é aquela que",
                "options": [
                    "descreve uma conduta proibida e comina uma sanção penal.",
                    "estabelece somente deveres morais.",
                    "apenas organiza a estrutura administrativa do Estado.",
                    "regula exclusivamente relações privadas."
                ],
                "answer": 0
            },
            {
                "q": "As normas penais permissivas são aquelas que",
                "options": [
                    "definem crimes omissivos próprios.",
                    "revogam automaticamente toda norma incriminadora.",
                    "autorizam determinadas condutas em situações previstas pelo ordenamento, como ocorre nas excludentes de ilicitude.",

                ],
                "answer": 2
            },
            {
                "q": "A norma penal em branco heterogênea caracteriza-se por",
                "options": [
                    "ser complementada exclusivamente por decisão judicial.",
                    "não possuir sanção penal.",
                    "ser necessariamente inconstitucional.",
                    "ter complemento proveniente de fonte normativa diversa daquela que editou a norma penal principal."
                ],
                "answer": 3
            },
            {
                "q": "A exigência de lei anterior decorre diretamente do princípio",

                    "da adequação social.",
                    "da culpabilidade.",

                    "da anterioridade da lei penal."

                "answer": 3
            },
            {
                "q": "Se determinada conduta é socialmente reprovável, mas não está criminalizada por lei, o juiz",

                    "pode aplicar analogia in malam partem.",

                    "não pode condenar criminalmente o agente apenas com base na reprovação social."

                "answer": 3
            },
            {
                "q": "A taxatividade exige que",
                "options": [

                "answer": 3
            },
            {
                "q": "O princípio da proporcionalidade, no campo penal, busca",
                "options": [
                    "eliminar toda discricionariedade judicial.",

                    "garantir sempre a pena máxima.",
                    "substituir o princípio da legalidade."
                ],
                "answer": 1
            },
            {
                "q": "O princípio da igualdade, aplicado ao Direito Penal, não impede",
                "options": [
                    "que pessoas em situação juridicamente idêntica recebam tratamento arbitrariamente distinto.",

                    "a discriminação baseada exclusivamente em características pessoais irrelevantes para o caso.",
                    "tratamento diferenciado quando houver fundamento jurídico relevante e constitucionalmente legítimo."
                ],
                "answer": 3
            },
            {
                "q": "A fragmentariedade e a subsidiariedade possuem em comum a ideia de que",
                "options": [

            {q:"A acao, no processo civil, relaciona-se",options:["ao direito de provocar a jurisdicao para obter uma tutela jurisdicional.","somente ao direito material.","exclusivamente a recursos.","a atividade administrativa do Executivo."],answer:0},
            {q:"Entre os elementos da acao estao",options:["partes, causa de pedir e pedido.","crime, pena e culpabilidade.","competencia, soberania e nacionalidade.","somente pedido e sentenca."],answer:0},
            {q:"No processo civil, o Ministerio Publico pode atuar",options:["como parte ou fiscal da ordem juridica, conforme as hipoteses legais.","somente como juiz.","apenas como advogado privado.","nunca em processos coletivos."],answer:0},
            {q:"Embargos de declaracao sao cabiveis, em regra, para",options:["corrigir obscuridade, contradicao, omissao ou erro material, conforme o CPC.","substituir toda e qualquer apelacao.","criar uma nova causa de pedir.","impedir qualquer recurso futuro."],answer:0},
            {q:"O mandado de seguranca destina-se a proteger",options:["direito liquido e certo, nao amparado por habeas corpus ou habeas data, diante de ilegalidade ou abuso de poder, nos termos da lei.","qualquer direito sem necessidade de prova pre-constituida.","somente direitos patrimoniais contratuais.","exclusivamente interesses penais."],answer:0},
            {q:"Na acao civil publica, possuem relevancia",options:["a tutela de interesses difusos, coletivos e individuais homogeneos, conforme o regime legal aplicavel.","somente interesses individuais disponiveis.","apenas cobrancas tributarias.","somente conflitos familiares."],answer:0},
            {q:"O inquerito civil e, em regra",options:["procedimento administrativo investigatorio instaurado pelo Ministerio Publico para apurar fatos relacionados a interesses que possam ensejar sua atuacao.","processo judicial obrigatorio antes de toda acao.","uma especie de recurso.","uma sentenca coletiva."],answer:0},
            {q:"A improbidade administrativa possui disciplina legal propria e envolve",options:["atos e sancoes definidos em lei, observados seus requisitos e garantias processuais.","qualquer erro administrativo automaticamente considerado improbidade.","somente crimes comuns.","apenas responsabilidade civil privada."],answer:0}
        ]
    }

const constitucionalContents = [{"name":"A — TEORIA GERAL DOS DIREITOS FUNDAMENTAIS","summary":"<p><b>Direitos humanos × direitos fundamentais:</b> a distinção é principalmente de plano normativo: os primeiros são reconhecidos no âmbito internacional; os segundos, no ordenamento constitucional interno. <b>Direitos</b> são bens e posições jurídicas; <b>garantias</b> são instrumentos de proteção (habeas corpus, mandado de segurança, mandado de injunção, habeas data).</p><p><b>Abertura material e cláusulas pétreas:</b> o art. 5º, §2º admite direitos decorrentes do regime, dos princípios e dos tratados. Tratados pelo rito do §3º equivalem a emenda; os demais têm status supralegal (RE 466.343). O art. 60, §4º, IV protege direitos e garantias individuais contra propostas tendentes a aboli-los.</p><p><b>Dimensões:</b> 1ª — liberdades (abstenção estatal); 2ª — direitos sociais (prestações positivas); 3ª — fraternidade/solidariedade (difusos e coletivos); 4ª/5ª — biotecnologia, informação, paz (doutrina). Características: historicidade, universalidade, relatividade, concorrência, inalienabilidade, imprescritibilidade e vinculação dos três Poderes.</p><p><b>Dimensões objetiva/subjetiva e eficácia:</b> subjetiva = pretensão do titular; objetiva = valores que irradiam e geram deveres de proteção. Eficácia vertical (Estado×indivíduo), horizontal (particular×particular) e, para parte da doutrina, diagonal (relação assimétrica). Teoria de Jellinek: status passivo, negativo, positivo e ativo.</p><p><b>Funções e limites:</b> função de defesa, de prestação, de prestação perante terceiros e de não discriminação. Limitações internas (inerentes ao conteúdo) e externas. Teoria dos limites dos limites: autorização constitucional, núcleo essencial, proporcionalidade (adequação, necessidade, proporcionalidade em sentido estrito) e normas claras/genéricas.</p>","questions":[{"q":"Direitos humanos e direitos fundamentais diferenciam-se, principalmente, porque","options":["direitos humanos pertencem ao plano internacional, enquanto direitos fundamentais são reconhecidos no plano constitucional interno.","são expressões sempre idênticas, sem diferença de plano normativo.","direitos fundamentais só existem em decisões judiciais.","direitos humanos só se aplicam a estrangeiros."],"answer":0,"explanation":"A distinção é de plano normativo: direitos humanos no Direito Internacional; direitos fundamentais no ordenamento constitucional interno."},{"q":"Segundo a clássica distinção atribuída a Rui Barbosa, garantias fundamentais são","options":["os bens e posições jurídicas assegurados à pessoa.","instrumentos processuais e institucionais de proteção dos direitos (ex.: habeas corpus, mandado de segurança).","sinônimos perfeitos de direitos fundamentais.","apenas normas penais."],"answer":1,"explanation":"Direitos são o 'quê' (bens jurídicos); garantias são o 'como' (instrumentos de tutela)."},{"q":"O art. 5º, §2º, da CF consagra a cláusula de abertura, que permite","options":["direitos fundamentais decorrentes dos princípios adotados pela Constituição e dos tratados internacionais de direitos humanos.","apenas os direitos expressamente listados no art. 5º.","somente direitos criados por lei ordinária.","a extinção de direitos por decreto."],"answer":0,"explanation":"O catálogo de direitos fundamentais é aberto (não tipicidade/exaustividade)."},{"q":"Tratados de direitos humanos aprovados pelo rito do art. 5º, §3º (dois turnos, 3/5 em cada Casa)","options":["têm equivalência de emenda constitucional.","têm status meramente legal.","não integram o ordenamento brasileiro.","possuem apenas valor interpretativo."],"answer":0,"explanation":"Exemplos: Convenção sobre Direitos das Pessoas com Deficiência e Tratado de Marraqueche."},{"q":"Segundo o STF (RE 466.343), tratados de direitos humanos não aprovados pelo rito qualificado possuem","options":["status constitucional.","status supralegal (acima da lei, abaixo da Constituição).","status infraconstitucional ordinário.","nenhuma eficácia no Brasil."],"answer":1,"explanation":"O STF firmou o status supralegal para tratados de direitos humanos aprovados pelo rito ordinário."},{"q":"Os direitos e garantias individuais são cláusulas pétreas com base no","options":["art. 60, §4º, IV, da CF.","art. 5º, §1º, apenas.","art. 1º da CF.","art. 37 da CF."],"answer":0,"explanation":"O poder constituinte derivado não pode deliberar sobre proposta tendente a abolir os direitos e garantias individuais."},{"q":"A 1ª dimensão dos direitos fundamentais caracteriza-se por","options":["exigir prestações positivas do Estado.","impor ao Estado dever de abstenção (liberdades negativas/civis e políticas).","proteger apenas direitos difusos.","tratar exclusivamente de biotecnologia."],"answer":1,"explanation":"Exemplos: liberdade de expressão, de locomoção, de reunião. Surgiram com as revoluções liberais."},{"q":"A 2ª dimensão dos direitos fundamentais exige","options":["apenas abstenção estatal.","prestações positivas do Estado (direitos sociais, econômicos e culturais).","titularidade exclusivamente coletiva.","supressão dos direitos de 1ª dimensão."],"answer":1,"explanation":"Exemplos: educação, saúde, moradia, trabalho, previdência."},{"q":"A 3ª dimensão dos direitos fundamentais refere-se a","options":["direitos de fraternidade/solidariedade, de titularidade difusa ou coletiva.","apenas direitos políticos.","somente liberdades individuais.","direitos que substituem as gerações anteriores."],"answer":0,"explanation":"Exemplos: meio ambiente equilibrado, desenvolvimento, autodeterminação dos povos."},{"q":"A teoria das gerações/dimensões implica que","options":["as dimensões se acumulam historicamente e todas permanecem vigentes.","cada nova dimensão extingue a anterior.","só a 1ª dimensão tem eficácia.","as dimensões são mutuamente excludentes."],"answer":0,"explanation":"Não há substituição; há acumulação histórica."},{"q":"A historicidade dos direitos fundamentais significa que","options":["eles nascem, evoluem e se transformam ao longo do tempo.","são atemporais e imutáveis.","não sofrem influência do contexto social.","só existem no Direito Internacional."],"answer":0,"explanation":"A própria teoria das gerações expressa essa dimensão histórica."},{"q":"A relatividade (limitabilidade) dos direitos fundamentais indica que","options":["nenhum direito fundamental é absoluto; todos podem sofrer limitações mediante ponderação.","todos os direitos são absolutos.","só o direito à vida é relativo.","limites só podem ser impostos por decreto."],"answer":0,"explanation":"Colisões são resolvidas pela ponderação (proporcionalidade)."},{"q":"A concorrência (acumulabilidade) de direitos fundamentais ocorre quando","options":["um mesmo titular exerce vários direitos simultaneamente sobre o mesmo fato.","dois direitos entram em conflito.","o Estado revoga direitos.","há renúncia total de direitos."],"answer":0,"explanation":"Concorrência (somam-se) não se confunde com colisão (tensão que exige ponderação)."},{"q":"A inalienabilidade (indisponibilidade) dos direitos fundamentais significa que","options":["não podem ser vendidos, doados ou renunciados em definitivo.","podem ser comercializados livremente.","prescrevem em cinco anos.","só valem para brasileiros."],"answer":0,"explanation":"Admite-se apenas restrição voluntária pontual e temporária."},{"q":"A imprescritibilidade dos direitos fundamentais significa que","options":["o direito em si não se extingue pelo decurso do tempo; o que pode prescrever é a pretensão reparatória.","todo direito fundamental prescreve em dois anos.","a pretensão reparatória nunca prescreve.","só direitos patrimoniais são imprescritíveis."],"answer":0,"explanation":"O não exercício, por si só, não extingue o direito fundamental."},{"q":"A dimensão subjetiva dos direitos fundamentais corresponde","options":["à pretensão que o titular pode exercer perante o Estado ou particulares.","apenas a valores abstratos sem titular.","exclusivamente a deveres do Estado.","à ausência de eficácia."],"answer":0,"explanation":"É o aspecto de faculdade individual: poder de exigir, resistir ou demandar."},{"q":"A dimensão objetiva dos direitos fundamentais significa que","options":["são valores que estruturam a ordem jurídica, irradiam efeitos e geram deveres de proteção ao Estado.","só existem quando o titular ajuíza ação.","não vinculam os Poderes.","são apenas regras de organização administrativa."],"answer":0,"explanation":"Irradiam por todo o sistema (interpretação, políticas públicas, dever de proteção)."},{"q":"A eficácia vertical dos direitos fundamentais descreve a relação","options":["entre Estado e indivíduo.","exclusivamente entre particulares.","entre países.","entre órgãos privados sem direitos."],"answer":0,"explanation":"É a incidência clássica na relação poder público × indivíduo."},{"q":"A eficácia horizontal dos direitos fundamentais refere-se à sua incidência","options":["nas relações entre particulares.","somente contra o Poder Executivo.","apenas em tratados internacionais.","exclusivamente em relações processuais."],"answer":0,"explanation":"Reconhecida pelo STF, por exemplo, no RE 201.819 (caso UBC)."},{"q":"No status passivo de Jellinek, o indivíduo","options":["encontra-se sujeito a deveres e obrigações impostos pela ordem jurídica.","exige prestações positivas do Estado.","participa da formação da vontade estatal.","possui esfera de liberdade absoluta."],"answer":0,"explanation":"Status subjectionis: sujeição ao poder estatal (ex.: pagar tributos)."},{"q":"O status negativo (libertatis) de Jellinek corresponde","options":["à esfera de liberdade em que o Estado deve se abster de interferir.","à exigência de prestações materiais.","ao exercício de direitos políticos.","à sujeição a deveres tributários."],"answer":0,"explanation":"Exemplos: liberdade de consciência, expressão, locomoção."},{"q":"O status positivo (civitatis) de Jellinek permite ao indivíduo","options":["exigir prestações e atuações positivas do Estado.","apenas se abster de agir.","participar só como eleitor.","afastar todas as leis."],"answer":0,"explanation":"Exemplos: direito à saúde, educação, assistência social."},{"q":"O status ativo (activae civitatis) de Jellinek relaciona-se","options":["à participação na formação da vontade estatal (votar, ser votado, ação popular).","à sujeição passiva a deveres.","somente ao direito à intimidade.","à proibição de participação política."],"answer":0,"explanation":"É a dimensão dos direitos políticos e de participação democrática."},{"q":"A função de defesa dos direitos fundamentais consiste em","options":["atuar como barreiras contra intervenções estatais indevidas (direitos de resistência).","exigir apenas prestações materiais.","substituir o princípio da igualdade.","criar crimes."],"answer":0,"explanation":"Típica da 1ª dimensão (ex.: inviolabilidade do domicílio)."},{"q":"A função de prestação dos direitos fundamentais impõe ao Estado","options":["deveres de ação positiva para concretizar condições mínimas de dignidade.","apenas abstenção.","a criação de novos crimes.","a extinção de direitos sociais."],"answer":0,"explanation":"Típica da 2ª dimensão (hospitais, escolas, políticas públicas)."},{"q":"A teoria dos limites dos limites exige, entre outros aspectos, que restrições a direitos fundamentais","options":["tenham respaldo constitucional, preservem o núcleo essencial e observem a proporcionalidade.","sejam sempre ilimitadas quando previstas em lei.","eliminem o conteúdo essencial do direito.","dispensem justificativa e clareza."],"answer":0,"explanation":"Também exige normas claras, genéricas e vedação de restrições casuísticas."},{"q":"No teste da proporcionalidade, a adequação examina se","options":["o meio escolhido é apto a alcançar o fim pretendido.","não existe alternativa menos restritiva.","o benefício sempre supera qualquer prejuízo.","a medida foi aprovada por unanimidade."],"answer":0,"explanation":"Adequação = aptidão do meio; necessidade e proporcionalidade em sentido estrito são etapas distintas."},{"q":"No teste da proporcionalidade, a necessidade verifica se","options":["existe alternativa menos restritiva e igualmente eficaz.","o meio é o mais popular.","o direito fundamental pode ser abolido.","a medida está dispensada de finalidade."],"answer":0,"explanation":"Busca-se o meio menos gravoso com eficácia equivalente."},{"q":"O núcleo essencial de um direito fundamental corresponde","options":["ao conteúdo mínimo indispensável que não pode ser esvaziado pela restrição.","à parte do direito que o legislador pode sempre eliminar.","à totalidade das normas infraconstitucionais.","a um conceito sem relevância."],"answer":0,"explanation":"Atingir o núcleo essencial equivale a esvaziar o direito, o que é vedado."},{"q":"Limitações internas dos direitos fundamentais são aquelas","options":["inerentes ao próprio conteúdo normativo do direito (ex.: liberdade de expressão não protege discurso de ódio).","impostas apenas por lei infraconstitucional.","sempre inconstitucionais.","aplicáveis somente a direitos sociais."],"answer":0,"explanation":"Decorrem da própria conformação do direito no texto constitucional."},{"q":"Limitações externas dos direitos fundamentais resultam de","options":["normas infraconstitucionais ou da colisão com outros direitos fundamentais.","apenas do próprio conteúdo do direito.","decisões administrativas sem lei.","costume internacional exclusivo."],"answer":0,"explanation":"Exigem maior escrutínio de proporcionalidade."}]},{"name":"B — DIREITO À VIDA E TEMAS BIOÉTICOS","summary":"<p><b>Direito à vida:</b> dimensão negativa (não ser privado da vida) e positiva (vida digna). Não é absoluto; admite ponderação. Art. 5º, caput, CF.</p><p><b>Casos destacados:</b> ADI 3510 (células-tronco — marco da atividade cerebral); ADPF 54 (anencefalia — interrupção não configura aborto); art. 128, I, CP (gravidez decorrente de estupro); gêmeos siameses (análise concreta, sem autorização automática); HC 124.306 (1ª Turma — interpretação conforme para aborto voluntário no 1º trimestre — não vinculante erga omnes).</p><p><b>Fim de vida:</b> distanásia = prolongamento artificial sem perspectiva de cura; ortotanásia = não emprego de meios extraordinários (omissão; Resolução CFM 1.805/2006); eutanásia = ação intencional de provocar a morte (homicídio); suicídio assistido = terceiro fornece meios, paciente pratica o ato final (art. 122, CP).</p><p><b>Testemunhas de Jeová:</b> adulto capaz — prevalece autonomia e liberdade religiosa; menores/incapazes — prevalece proteção da vida.</p>","questions":[{"q":"O direito à vida, conforme o material, possui dimensão","options":["negativa (não ser privado da vida) e positiva (ligada a uma vida digna).","exclusivamente negativa, sem deveres estatais.","exclusivamente patrimonial.","restrita à proteção contra homicídio."],"answer":0,"explanation":"Há proteção contra privação da vida e deveres positivos de proteção (saúde, segurança etc.)."},{"q":"Na ADI 3510, o STF julgou a constitucionalidade de","options":["pesquisas com células-tronco embrionárias previstas na Lei 11.105/2005.","restrições a tatuagens em concursos.","símbolos religiosos em prédios públicos.","horários de provas de vestibular."],"answer":0,"explanation":"O STF adotou a atividade do sistema nervoso central como marco relevante do início da vida."},{"q":"Segundo o material, na ADPF 54 o STF decidiu que a interrupção da gestação de feto anencéfalo","options":["não configura a conduta típica de aborto, nas condições reconhecidas pelo Tribunal.","depende sempre de autorização judicial prévia.","é automaticamente equiparada a homicídio.","é regulada exclusivamente por lei municipal."],"answer":0,"explanation":"Comprovada a anencefalia, a gestante pode optar pela interrupção sem autorização judicial prévia."},{"q":"A gravidez decorrente de estupro é hipótese em que","options":["o Código Penal prevê a possibilidade de aborto legal (art. 128, I), com consentimento da gestante.","há necessidade obrigatória de autorização do STF.","o aborto é sempre proibido sem exceção.","somente decisão do júri autoriza a interrupção."],"answer":0,"explanation":"Excludente de ilicitude prevista no art. 128, I, do CP."},{"q":"A gestação de gêmeos siameses","options":["não tem interrupção automaticamente autorizada; exige análise concreta dos riscos.","é sempre interrompível sem análise do caso concreto.","recebe automaticamente o mesmo tratamento da anencefalia.","não envolve qualquer ponderação constitucional."],"answer":0,"explanation":"Exige demonstração de risco à gestante ou risco letal inevitável para ao menos um dos neonatos."},{"q":"No HC 124.306 (1ª Turma), o STF conferiu interpretação conforme aos arts. 124-126 do CP para","options":["excluir do tipo penal a interrupção voluntária da gestação no primeiro trimestre.","criminalizar qualquer interrupção gestacional.","tornar o aborto crime hediondo.","exigir autorização judicial em todos os casos."],"answer":0,"explanation":"Decisão de Turma (não vinculante erga omnes). Fundamento: autonomia, dignidade e integridade da mulher."},{"q":"Distanásia é definida como","options":["prolongamento artificial da vida por meios extraordinários, mesmo sem perspectiva de cura.","ação intencional para provocar a morte do paciente.","auxílio prestado para que a própria pessoa encerre a vida.","não emprego de meios extraordinários para prolongar a vida."],"answer":0,"explanation":"Pode configurar tratamento desumano ou degradante (art. 5º, III, CF)."},{"q":"A distinção central entre ortotanásia e eutanásia é que","options":["ortotanásia envolve não empregar meios extraordinários (omissão); eutanásia envolve ação intencional de provocar a morte.","ambas significam exatamente a mesma conduta.","ortotanásia é sempre uma ação destinada a antecipar a morte.","eutanásia consiste apenas em recusar transfusão."],"answer":0,"explanation":"A diferença omissão × ação determina a tipicidade penal."},{"q":"O suicídio assistido diferencia-se da eutanásia porque","options":["o próprio paciente pratica o ato final, com auxílio de terceiro que fornece meios ou instruções.","não há participação de terceiro.","o médico necessariamente pratica a ação que causa diretamente a morte.","é uma forma de distanásia."],"answer":0,"explanation":"Tipificado no art. 122 do CP (induzimento, instigação ou auxílio ao suicídio)."},{"q":"A ortotanásia, segundo a Resolução CFM 1.805/2006,","options":["é autorizada sob condições de consentimento informado e terminalidade irreversível.","é tipificada como homicídio.","exige autorização judicial prévia em todos os casos.","é proibida em qualquer hipótese."],"answer":0,"explanation":"A Resolução é ato administrativo; a doutrina majoritária considera a ortotanásia fato atípico."},{"q":"Na discussão sobre transfusão de sangue e Testemunhas de Jeová, o material destaca que","options":["a autonomia de adulto capaz tende a ser protegida, enquanto situações envolvendo menores exigem consideração prioritária à proteção da vida.","a liberdade religiosa nunca pode ser considerada.","toda recusa é juridicamente inválida.","a decisão é idêntica para adultos capazes e crianças em qualquer hipótese."],"answer":0,"explanation":"Colisão entre direito à vida, autonomia e liberdade religiosa (art. 5º, VI)."},{"q":"A eutanásia, no ordenamento brasileiro, é tipificada como","options":["homicídio (art. 121 do CP).","fato atípico.","contravenção penal.","ilícito apenas civil."],"answer":0,"explanation":"Há debate doutrinário e comparatista sobre eventual descriminalização sob condições estritas."},{"q":"O direito à vida admite exceção expressa na própria Constituição no caso de","options":["pena de morte em caso de guerra declarada (art. 5º, XLVII, 'a').","qualquer crime hediondo.","decisão administrativa.","lei ordinária genérica."],"answer":0,"explanation":"Confirma que o direito à vida, embora basilar, não é absoluto no texto constitucional."}]},{"name":"C — LIBERDADE DE EXPRESSÃO, RELIGIÃO E DADOS PESSOAIS","summary":"<p><b>Liberdade de manifestação do pensamento:</b> art. 5º, IV e IX. Protege a exteriorização do pensamento; veda o anonimato; admite responsabilização por abusos (honra, imagem). Não é imunidade para discurso discriminatório ou prática criminosa. Dimensão negativa (impedir censura) e positiva (garantir espaços de fala).</p><p><b>Exemplos:</b> HC 82.424 (discurso de ódio/racismo); Marcha da Maconha (defesa de descriminalização ≠ apologia); proselitismo religioso; tatuagens em concursos; Tema 786 (direito ao esquecimento incompatível com a CF).</p><p><b>Liberdade religiosa e laicidade:</b> art. 5º, VI. Laicidade = neutralidade estatal + proteção da liberdade de crença e culto (não hostilidade à religião). Temas: ADI 5258 (Bíblias em escolas), Tema 1086 (símbolos religiosos em prédios públicos), pregação em vagões, ADI 3901 (provas em dias religiosos).</p><p><b>Proteção de dados:</b> art. 5º, LXXIX (EC 115/2022) — direito à proteção dos dados pessoais, inclusive nos meios digitais.</p>","questions":[{"q":"O exercício da liberdade de expressão","options":["não exclui a responsabilização por abusos, como danos materiais, morais ou à imagem.","impede qualquer responsabilização civil por dano à honra.","autoriza discurso discriminatório em qualquer circunstância.","exige autorização prévia do Estado para toda opinião."],"answer":0,"explanation":"Há responsabilização posterior por abusos, sem confundir com censura prévia generalizada."},{"q":"A liberdade de manifestação do pensamento (art. 5º, IV) é acompanhada pela vedação","options":["ao anonimato.","de qualquer crítica ao Estado.","de manifestação artística.","de toda opinião impopular."],"answer":0,"explanation":"O texto constitucional veda expressamente o anonimato."},{"q":"No caso do discurso de ódio contra judeus (HC 82.424), o STF","options":["manteve condenação por racismo, reconhecendo limites à liberdade de expressão.","afirmou que toda manifestação é imune ao Direito Penal.","proibiu toda publicação jornalística sobre religião.","decidiu que honra e dignidade não têm proteção constitucional."],"answer":0,"explanation":"A liberdade de expressão encontra limites diante de ideias discriminatórias e de ódio."},{"q":"A Marcha da Maconha foi considerada compatível com a liberdade de expressão porque","options":["a defesa pública da descriminalização não se confunde, por si só, com incitação ou apologia de crime.","descriminalizou automaticamente todas as drogas.","autorizou a prática de qualquer crime em manifestações.","a manifestação dispensa qualquer limite constitucional."],"answer":0,"explanation":"Distingue-se a proposta de mudança legislativa da apologia de fato criminoso."},{"q":"O proselitismo religioso é protegido porque","options":["pode estar abrangido pela liberdade de manifestação do pensamento e pela liberdade religiosa.","exclui a liberdade religiosa de outras pessoas.","permite constranger fisicamente terceiros à conversão.","não se submete a nenhum limite jurídico."],"answer":0,"explanation":"A transmissão persuasiva de crenças é protegida, sem autorizar coerção."},{"q":"Quanto a tatuagens em concursos públicos, o material indica que","options":["restrições não podem ser arbitrárias; conteúdo que viole valores constitucionais pode ser relevante.","qualquer tatuagem impede a posse.","o edital pode proibir todas as tatuagens sem justificativa.","tatuagens são obrigatórias para cargos públicos."],"answer":0,"explanation":"O STF rejeita restrições genéricas a pessoas tatuadas."},{"q":"O princípio da laicidade estatal significa que","options":["o Estado não deve estabelecer preferência religiosa, sem deixar de proteger a liberdade religiosa.","o Estado deve adotar uma religião oficial.","somente religiões majoritárias têm proteção.","o Estado deve impedir toda manifestação religiosa em espaço privado."],"answer":0,"explanation":"Laicidade ≠ hostilidade à religião; exige neutralidade + proteção da liberdade de crença e culto."},{"q":"A ADI 5258 tratou da exigência legal de","options":["manutenção de exemplares da Bíblia em escolas e bibliotecas públicas estaduais, considerada contrária à laicidade.","proibição de todas as religiões em bibliotecas.","uso de tatuagens por servidores.","transfusão de sangue em hospitais privados."],"answer":0,"explanation":"A imposição de manter Bíblias distingue-se da mera possibilidade de disponibilização."},{"q":"Sobre símbolos religiosos em prédios públicos, o Tema 1086 admite sua presença quando","options":["o objetivo é manifestar a tradição cultural da sociedade brasileira, sem violar não discriminação, laicidade e impessoalidade.","o Estado declara oficialmente uma religião.","há obrigação de instalar símbolos de uma única religião em todos os órgãos.","não há qualquer finalidade cultural ou institucional."],"answer":0,"explanation":"A exposição com finalidade de manifestação da tradição cultural pode ser compatível com a CF."},{"q":"A proteção constitucional aos locais de culto, no exemplo de pregação em vagões de trem,","options":["não significa necessariamente que locais inadequados ao culto devam ser disponibilizados (ex.: vagões em funcionamento).","garante pregação em qualquer lugar, horário e circunstância.","afasta toda regra de uso dos espaços públicos.","proíbe qualquer manifestação religiosa fora de templos."],"answer":0,"explanation":"Distingue-se a proteção a locais adequados de culto da utilização de espaços inadequados."},{"q":"No tema de restrições de dias e horários para provas por motivos religiosos, há tensão entre","options":["liberdade religiosa e organização dos concursos/vestibulares.","direito de propriedade e extradição.","nacionalidade e direitos políticos exclusivamente.","separação de Poderes e estado de defesa."],"answer":0,"explanation":"ADI 3901 e a proteção da liberdade religiosa diante da disciplina de provas públicas."},{"q":"A proteção de dados pessoais, inclusive nos meios digitais, está expressamente prevista no","options":["art. 5º, LXXIX, incluído pela EC 115/2022.","art. 5º, IV, exclusivamente.","art. 60, §4º.","art. 37, XXI."],"answer":0,"explanation":"Direito fundamental expresso à proteção dos dados pessoais."},{"q":"Segundo o STF (Tema 786), o direito ao esquecimento","options":["é incompatível com a Constituição, pois colide com a liberdade de expressão e o direito à informação.","prevalece sempre sobre a liberdade de expressão.","é absoluto e irrestrito.","só se aplica a dados bancários."],"answer":0,"explanation":"RE 1.010.606 — o direito ao esquecimento não encontra respaldo na CF."},{"q":"A liberdade de expressão possui dimensão","options":["negativa (impedir censura) e positiva (garantir espaços de fala e pluralidade).","apenas negativa.","apenas positiva.","exclusivamente sancionatória."],"answer":0,"explanation":"Não se limita a impedir interferência; exige também condições para o exercício efetivo."}]}];

const flashcardDecks = {"constitucional":{"name":"Direito Constitucional — Direitos Fundamentais","cards":[{"front":"O que são direitos fundamentais?","back":"Direitos e garantias essenciais à dignidade da pessoa humana."},{"front":"1ª dimensão: quais direitos e deveres do Estado?","back":"Direitos de liberdade (civis e políticos); exigem abstenção estatal (status negativo). Exemplos: liberdade de expressão, de locomoção, de consciência, de reunião e de associação. Surgiram com as revoluções liberais (Francesa e Americana)."},{"front":"2ª dimensão: quais direitos e deveres do Estado?","back":"Direitos de igualdade (sociais, econômicos e culturais); exigem prestações positivas do Estado. Exemplos: educação, saúde, moradia, trabalho e previdência social."},{"front":"3ª dimensão: quais direitos protege?","back":"Direitos de fraternidade ou solidariedade, de titularidade difusa ou coletiva. Exemplos: meio ambiente equilibrado, autodeterminação dos povos, desenvolvimento sustentável e direito do consumidor."},{"front":"4ª dimensão: a que direitos se relaciona, segundo o resumo?","back":"Globalização, biotecnologia e bioética, conforme parte da doutrina moderna."},{"front":"5ª dimensão: qual direito é destacado por parte da doutrina?","back":"Direito à paz planetária; a classificação varia conforme a doutrina."},{"front":"O que significa historicidade?","back":"Os direitos fundamentais nascem, evoluem e se transformam ao longo da história; não são atemporais. Exemplo: evolução dos direitos das mulheres e das pessoas LGBTQIA+."},{"front":"O que significa universalidade?","back":"São reconhecidos como pertencentes a todos os seres humanos, independentemente de nacionalidade, cultura ou condição. Exemplo: Declaração Universal de 1948."},{"front":"O que significa relatividade ou limitabilidade?","back":"Nenhum direito fundamental é absoluto; todos podem sofrer limitações quando colidem com outros direitos ou interesses constitucionais. Solução pela ponderação (proporcionalidade)."},{"front":"O que significa concorrência?","back":"Diferentes direitos fundamentais podem ser exercidos cumulativamente ao mesmo tempo."},{"front":"O que significa inalienabilidade?","back":"Não podem ser vendidos, doados ou transferidos como bens patrimoniais."},{"front":"O que significa imprescritibilidade?","back":"Não se perdem pelo decurso do tempo. O que pode prescrever é a pretensão reparatória decorrente de sua violação, não o direito em si."},{"front":"Como os três Poderes se vinculam aos direitos fundamentais?","back":"Vinculam o Legislativo (criação de leis), o Executivo (administração) e o Judiciário (interpretação e aplicação). Consequência da supremacia constitucional."},{"front":"Qual a diferença entre Direitos Humanos e Direitos Fundamentais?","back":"Direitos Humanos: reconhecidos no plano do Direito Internacional (tratados, convenções e declarações). Direitos Fundamentais: direitos humanos constitucionalizados, incorporados ao texto da Constituição de um Estado específico (no Brasil, principalmente art. 5º, mas não só)."},{"front":"Qual a diferença entre Direitos e Garantias Fundamentais?","back":"Direitos são os bens e posições jurídicas asseguradas à pessoa (vida, liberdade, igualdade, propriedade). Garantias são os instrumentos processuais e institucionais destinados a proteger e efetivar esses direitos (ex.: habeas corpus, mandado de segurança, mandado de injunção, habeas data)."},{"front":"Os direitos fundamentais são somente aqueles positivados expressamente na Constituição?","back":"Não. O art. 5º, §2º consagra cláusula de abertura material: direitos decorrentes dos princípios adotados pela Constituição e dos tratados internacionais de direitos humanos."},{"front":"Quais são os dois vetores da cláusula de abertura dos direitos fundamentais?","back":"1) Princípios adotados pela Constituição (ex.: dignidade da pessoa humana, cidadania, pluralismo político). 2) Tratados internacionais de direitos humanos."},{"front":"Como os tratados internacionais de direitos humanos integram o bloco de direitos fundamentais no Brasil?","back":"Tratados aprovados pelo rito qualificado (dois turnos, 3/5 em cada Casa) têm equivalência de emenda constitucional. Os demais (rito ordinário) têm status supralegal (acima da lei, abaixo da Constituição)."},{"front":"Os direitos e garantias fundamentais são cláusulas pétreas?","back":"Sim. Art. 60, §4º, IV: não será objeto de deliberação proposta de emenda tendente a abolir os direitos e garantias individuais. Debate doutrinário sobre se os direitos sociais também estão abrangidos."},{"front":"A teoria das gerações/dimensões implica substituição dos direitos anteriores?","back":"Não. As dimensões se acumulam historicamente; todas permanecem vigentes e exigíveis."},{"front":"O que é a dimensão subjetiva dos direitos fundamentais?","back":"Perspectiva do titular: pretensão jurídica de exigir conduta (comissiva ou omissiva) do Estado ou de particulares. Exemplo: impetrar habeas corpus para proteger a liberdade de locomoção."},{"front":"O que é a dimensão objetiva dos direitos fundamentais?","back":"Perspectiva dos direitos como valores constitucionais que irradiam por toda a ordem jurídica, orientando interpretação, políticas públicas e gerando deveres de proteção (Schutzpflicht). Exemplo: dignidade da pessoa humana orienta todo o ordenamento."},{"front":"As dimensões objetiva e subjetiva dos direitos fundamentais são exclusivas entre si?","back":"Não. São complementares: todo direito fundamental possui ambas, e a interpretação constitucional deve considerá-las simultaneamente."},{"front":"Onde a Constituição Federal trata dos direitos fundamentais?","back":"Título II (arts. 5º a 17), com destaque para o art. 5º, caput e §§ 1º, 2º e 3º (aplicação imediata, cláusula de abertura e regime dos tratados)."},{"front":"Qual o dispositivo constitucional que prevê as cláusulas pétreas relativas a direitos fundamentais?","back":"Art. 60, § 4º, IV da Constituição Federal."},{"front":"Qual o entendimento do STF sobre o status dos tratados de direitos humanos não aprovados pelo rito qualificado?","back":"Status supralegal (RE 466.343)."},{"front":"Dê um exemplo clássico de colisão entre direitos fundamentais e a técnica de solução.","back":"Liberdade de expressão vs. proteção da honra e da imagem. Solução pela ponderação (proporcionalidade e razoabilidade), buscando o menor sacrifício possível de cada direito."},{"front":"Dê um exemplo de concorrência de direitos fundamentais.","back":"Ao publicar reportagem investigativa, o jornalista exerce simultaneamente liberdade de expressão, direito de acesso à informação e liberdade profissional."},{"front":"É possível a renúncia total e permanente de um direito fundamental?","back":"Não. São indisponíveis. Admite-se apenas restrição voluntária pontual e temporária (ex.: reality show)."},{"front":"O que pode prescrever em relação aos direitos fundamentais?","back":"A pretensão reparatória decorrente de sua violação. O direito fundamental em si não prescreve."},{"front":"Qual a relação entre a teoria das gerações e a historicidade dos direitos fundamentais?","back":"A própria teoria das gerações expressa a dimensão histórica dos direitos fundamentais: eles nascem, evoluem e se transformam ao longo do tempo."},{"front":"4ª dimensão: a que direitos se relaciona, segundo a doutrina (Bonavides e Bobbio)?","back":"Biotecnologia, engenharia genética, ciência, democracia, informação e pluralismo. Parte da doutrina também associa a essa dimensão os desafios da era digital."},{"front":"5ª dimensão: qual direito é destacado por parte da doutrina (Bonavides)?","back":"Direito à paz. A classificação é controversa e não universalmente aceita."},{"front":"O que significa concorrência (ou acumulabilidade)?","back":"Um mesmo titular pode exercer vários direitos fundamentais simultaneamente. Exemplo: liberdade de expressão + reunião + associação."},{"front":"O que significa inalienabilidade (indisponibilidade)?","back":"Os direitos fundamentais não podem ser vendidos, doados ou renunciados em definitivo. Admite-se apenas restrição voluntária pontual e temporária."},{"front":"Qual a diferença entre Direitos e Garantias Fundamentais (Rui Barbosa)?","back":"Direitos são os bens e posições jurídicas reconhecidos ao titular (o \"quê\": vida, liberdade, igualdade, propriedade). Garantias são os instrumentos processuais e institucionais de tutela (o \"como\": habeas corpus, mandado de segurança, habeas data, mandado de injunção)."},{"front":"Quais são os dois vetores da cláusula de abertura (art. 5º, §2º)?","back":"1) Princípios adotados pela Constituição (dignidade da pessoa humana, cidadania, pluralismo político etc.). 2) Tratados internacionais de direitos humanos dos quais o Brasil seja parte."},{"front":"Como os tratados internacionais de direitos humanos integram o bloco de direitos fundamentais?","back":"Rito qualificado (art. 5º, §3º: dois turnos, 3/5 em cada Casa) → equivalência de emenda constitucional (ex.: Convenção sobre Direitos das Pessoas com Deficiência). Rito ordinário → status supralegal (RE 466.343)."},{"front":"As dimensões objetiva e subjetiva são exclusivas entre si?","back":"Não. São complementares: todo direito fundamental possui ambas, e a interpretação deve considerá-las simultaneamente."},{"front":"Qual o dispositivo das cláusulas pétreas relativas a direitos fundamentais?","back":"Art. 60, §4º, IV da Constituição Federal."},{"front":"Qual o entendimento do STF sobre tratados de direitos humanos não aprovados pelo rito qualificado?","back":"Status supralegal (RE 466.343/2008): acima da legislação infraconstitucional, abaixo da Constituição."},{"front":"Dê um exemplo clássico de colisão entre direitos fundamentais.","back":"Liberdade de expressão vs. proteção da honra e da imagem (art. 5º, IV e X). Solução pela ponderação (proporcionalidade: adequação, necessidade e proporcionalidade em sentido estrito — Robert Alexy)."},{"front":"Qual a relação entre a teoria das gerações e a historicidade?","back":"A própria teoria das gerações expressa a dimensão histórica: os direitos nascem, evoluem e se transformam ao longo do tempo."},{"front":"Quais são as modalidades de eficácia dos direitos fundamentais?","back":"Vertical (Estado × indivíduo), Horizontal (particular × particular) e Diagonal (particular × particular em relações assimétricas de poder)."},{"front":"O que é a eficácia vertical dos direitos fundamentais?","back":"Eficácia clássica: vinculam o Estado em face dos particulares. O Estado deve respeitar (dimensão negativa) e proteger (dimensão positiva)."},{"front":"O que é a eficácia horizontal dos direitos fundamentais?","back":"Aplicação nas relações entre particulares (ex.: empregador × empregado, associação × associado). Reconhecida pelo STF no RE 201.819 (caso UBC — contraditório e ampla defesa na exclusão de associado)."},{"front":"O que é a eficácia diagonal dos direitos fundamentais?","back":"Termo de uso variável, aplicado a relações entre particulares com assimetria de poder (emprego, consumo, plataformas digitais × usuários). Parte da doutrina prefere tratá-la como extensão da eficácia horizontal."},{"front":"Quais são os quatro status de Jellinek?","back":"1) Status passivo (subjectionis); 2) Status negativo (libertatis); 3) Status positivo (civitatis); 4) Status ativo (activae civitatis). Não são excludentes: um mesmo indivíduo pode ocupar todos simultaneamente."},{"front":"O que é o status passivo (status subjectionis) de Jellinek?","back":"O indivíduo está em sujeição ao poder estatal; o Estado pode impor-lhe deveres e obrigações. Exemplos: pagar tributos, cumprir ordens judiciais, serviço militar obrigatório."},{"front":"O que é o status negativo (status libertatis) de Jellinek?","back":"Esfera de liberdade em que o Estado não pode interferir (dever de abstenção). Exemplos: liberdade de consciência, de expressão, de locomoção e intimidade."},{"front":"O que é o status positivo (status civitatis) de Jellinek?","back":"O indivíduo pode exigir prestações positivas do Estado (serviços, proteção, políticas públicas). Exemplos: saúde pública (SUS), educação gratuita, assistência social e moradia."},{"front":"O que é o status ativo (status activae civitatis) de Jellinek?","back":"Participação do indivíduo na formação da vontade estatal (direitos políticos). Exemplos: votar, ser votado, propor ação popular, iniciativa popular de leis, plebiscito e referendo."},{"front":"Quais são as quatro funções dos direitos fundamentais segundo a classificação doutrinária?","back":"1) Função de defesa (proteção negativa); 2) Função de prestação; 3) Função de prestação perante terceiros (eficácia horizontal); 4) Função de não discriminação."},{"front":"O que é a função de defesa dos direitos fundamentais?","back":"Barreiras contra intervenções estatais indevidas. Direitos de resistência/oposição. Típica da 1ª dimensão. Exemplo: inviolabilidade do domicílio."},{"front":"O que é a função de prestação dos direitos fundamentais?","back":"Impõem ao Estado deveres de ação positiva para concretizar condições mínimas de dignidade. Típica da 2ª dimensão. Exemplo: manter hospitais públicos e escolas gratuitas."},{"front":"O que é a função de prestação perante terceiros?","back":"Irradiação dos direitos fundamentais nas relações entre particulares (eficácia horizontal/diagonal). Exemplo: aplicação da igualdade e não discriminação em relações de emprego privado."},{"front":"O que é a função de não discriminação dos direitos fundamentais?","back":"Operam como vetores de igualdade material, vedando tratamentos discriminatórios injustificados. Impõem dever de isonomia ao Estado e aos particulares."},{"front":"Como se classificam as limitações dos direitos fundamentais?","back":"Limitações internas (inerentes ao próprio conteúdo do direito) e limitações externas (impostas por normas infraconstitucionais ou colisão com outros direitos)."},{"front":"O que são limitações internas dos direitos fundamentais?","back":"Inerentes ao próprio conteúdo normativo do direito. O texto constitucional já delimita o alcance. Exemplo: liberdade de expressão não protege discurso de ódio, calúnia ou incitação à violência."},{"front":"O que são limitações externas dos direitos fundamentais?","back":"Restrições impostas por normas infraconstitucionais ou pela colisão com outros direitos fundamentais. Exigem maior escrutínio de proporcionalidade. Exemplo: lei que excepciona o sigilo de fonte jornalística em crimes graves."},{"front":"O que é a Teoria dos Limites dos Limites (Schranken-Schranken)?","back":"Conjunto de requisitos que qualquer restrição a direitos fundamentais deve observar para ser constitucionalmente válida."},{"front":"Quais são os quatro requisitos da Teoria dos Limites dos Limites?","back":"1) Autorização constitucional; 2) Preservação do núcleo essencial (Wesensgehalt); 3) Observância da proporcionalidade; 4) Normas claras, genéricas e vedação de restrições casuísticas."},{"front":"O que significa \"autorização constitucional\" na Teoria dos Limites dos Limites?","back":"A restrição deve encontrar respaldo na própria Constituição. Quando a CF prevê \"nos termos da lei\", o legislador pode conformar, mas dentro dos demais limites."},{"front":"O que significa \"preservação do núcleo essencial\" na Teoria dos Limites dos Limites?","back":"Qualquer limitação deve resguardar o conteúdo mínimo indispensável do direito. Atingir o núcleo equivale a esvaziar o direito, o que é vedado."},{"front":"O que significa \"observância da proporcionalidade\" na Teoria dos Limites dos Limites?","back":"Teste tripartite: (a) adequação (meio apto ao fim?); (b) necessidade (não há meio menos restritivo?); (c) proporcionalidade em sentido estrito (benefícios superam prejuízos?)."},{"front":"O que significa a vedação de restrições casuísticas na Teoria dos Limites dos Limites?","back":"As restrições devem ser formuladas em normas gerais e abstratas, com clareza e precisão, evitando disposições ad hoc que violem a isonomia e a segurança jurídica."},{"front":"O direito à vida é absoluto?","back":"Não. Tem dimensão negativa (não ser privado da vida) e positiva (vida digna). Admite ponderação com outros direitos (dignidade, autonomia, saúde, liberdade religiosa). A própria CF admite exceção (pena de morte em guerra declarada — art. 5º, XLVII, \"a\")."},{"front":"Qual o entendimento do STF sobre interrupção de gestação de feto anencéfalo?","back":"ADPF 54: não configura crime de aborto. Prevalece a proteção à saúde física e psíquica da gestante e à dignidade da pessoa humana. Comprovada a anencefalia por laudos, a gestante pode optar pela interrupção sem autorização judicial prévia."},{"front":"Qual o regime jurídico do aborto em caso de gravidez decorrente de estupro?","back":"Art. 128, I, do Código Penal: excludente de ilicitude. O médico pode realizar o abortamento com consentimento da gestante (ou representante legal), sem necessidade de autorização judicial."},{"front":"Qual o entendimento sobre interrupção de gestação de gêmeos siameses?","back":"Não é automaticamente autorizada. Exige análise do caso concreto: risco à vida da gestante ou risco letal inevitável para ao menos um dos neonatos na separação cirúrgica. Ponderação do direito à vida de cada indivíduo."},{"front":"O que decidiu a 1ª Turma do STF no HC 124.306 sobre aborto voluntário no 1º trimestre?","back":"Interpretação conforme à Constituição dos arts. 124-126 do CP para excluir do tipo penal a interrupção voluntária no primeiro trimestre. Fundamento: autonomia, integridade física e psíquica, dignidade e igualdade da mulher. Decisão de Turma (não vinculante erga omnes)."},{"front":"O que é distanásia?","back":"Prolongamento artificial da vida por meios extraordinários, mesmo sem perspectiva de cura ou melhora. Pode configurar tratamento desumano ou degradante (art. 5º, III, CF)."},{"front":"O que é suicídio assistido?","back":"Terceiro (médico ou familiar) fornece meios ou instruções para que o próprio paciente encerre sua vida. No Brasil, tipificado no art. 122 do Código Penal (induzimento, instigação ou auxílio ao suicídio)."},{"front":"O que é ortotanásia?","back":"Permitir a morte natural, sem prolongar artificialmente a vida de paciente terminal irreversível. É omissão (não fazer). Autorizada pela Resolução CFM 1.805/2006, desde que haja consentimento informado e decisão médica fundamentada. Considerada fato atípico pela doutrina majoritária."},{"front":"O que é eutanásia?","back":"Ação deliberada de provocar a morte de paciente em sofrimento grave para encerrar sua dor. É ação (fazer). Tipificada como homicídio (art. 121, CP). Debate constitucional sobre autonomia vs. dever estatal de proteção da vida."},{"front":"Qual a principal diferença entre ortotanásia e eutanásia?","back":"Ortotanásia é omissão (não empregar meios extraordinários); eutanásia é ação comissiva (provocar a morte). Essa diferença determina a tipicidade penal."},{"front":"Como a jurisprudência e a doutrina tratam a recusa de transfusão de sangue por Testemunhas de Jeová?","back":"Paciente adulto e capaz: prevalece a autonomia e a liberdade de crença (art. 5º, VI). Menores e incapazes: prevalece o direito à vida, com dever de intervenção estatal."},{"front":"O que é a liberdade de manifestação do pensamento (art. 5º, IV e IX)?","back":"Direito de primeira dimensão essencial à democracia. Tutela a exteriorização do pensamento (incluindo meios artísticos, jornalísticos e acadêmicos). Possui dimensão negativa (impedir censura) e positiva (garantir espaços de fala e pluralidade). Vedado o anonimato."},{"front":"O direito ao esquecimento é compatível com a Constituição segundo o STF?","back":"Não. Tema 786 (RE 1.010.606): o direito ao esquecimento é incompatível com a CF, pois colide com a liberdade de expressão e o direito à informação."},{"front":"Qual o marco do início da vida humana segundo o STF na ADI 3510 (células-tronco)?","back":"A atividade do sistema nervoso central (atividade cerebral). Embriões congelados em laboratório que não serão implantados não atingiram esse marco; sua utilização em pesquisa não viola o direito à vida."},{"front":"Qual o dispositivo que consagrou o direito à proteção de dados pessoais como direito fundamental?","back":"Art. 5º, LXXIX, CF/88, incluído pela EC 115/2022 (proteção de dados pessoais, inclusive nos meios digitais)."},{"front":"Qual a resolução do CFM que autoriza a ortotanásia?","back":"Resolução CFM nº 1.805/2006, sob condições de consentimento informado e terminalidade irreversível. Não tem força de lei (ato administrativo)."},{"front":"Quais artigos do Código Penal são relevantes para os temas de fim de vida e aborto?","back":"Art. 121 (homicídio/eutanásia); art. 122 (auxílio ao suicídio); arts. 124 a 126 (aborto); art. 128, I (excludente de ilicitude no aborto decorrente de estupro)."},{"front":"Qual a diferença entre colisão e concorrência de direitos fundamentais?","back":"Concorrência: exercício simultâneo e cumulativo de vários direitos (somam-se). Colisão: conflito entre direitos que exige ponderação e hierarquização casuística."},{"front":"O que significa a cláusula de abertura do art. 5º, §2º?","back":"O catálogo de direitos fundamentais é aberto (não exaustivo). Direitos podem decorrer do regime e dos princípios adotados pela Constituição, ou dos tratados internacionais de direitos humanos."},{"front":"Cite dois tratados de direitos humanos que adquiriram equivalência de emenda constitucional no Brasil.","back":"Convenção sobre os Direitos das Pessoas com Deficiência (Decreto 6.949/2009) e Tratado de Marraqueche (Decreto 9.522/2018), ambos aprovados pelo rito do art. 5º, §3º."},{"front":"Há posição pacífica do STF sobre se os direitos sociais são cláusulas pétreas?","back":"Não. Há divergência doutrinária. O STF já reconheceu direitos individuais fora do art. 5º (ex.: anterioridade tributária no art. 150), mas não há posição pacífica sobre a inclusão genérica dos direitos sociais no art. 60, §4º, IV."},{"front":"Qual o autor da teoria das gerações dos direitos fundamentais?","back":"Karel Vasak (conferência de 1979 em Estrasburgo). Sistematizada no Brasil principalmente por Paulo Bonavides."},{"front":"Qual o autor da teoria dos quatro status?","back":"Georg Jellinek (final do século XIX)."},{"front":"Qual a técnica utilizada para resolver colisões entre direitos fundamentais?","back":"Ponderação, baseada no princípio da proporcionalidade (adequação, necessidade e proporcionalidade em sentido estrito), desenvolvida por Robert Alexy e amplamente adotada pelo STF."}]}};

    { name: "DIREITO PENAL", description:"Norma penal, fato típico, ilicitude e culpabilidade", contents: contents },
    { name: "DIREITO CIVIL", description:"Bloco aguardando cadastro de questões", contents: [] },

    { name: "DIREITO PROCESSUAL PENAL", description:"Questões de revisão processual penal", contents: processoPenalContents },
    { name: "DIREITO PROCESSUAL CIVIL", description:"Questões de revisão processual civil", contents: processoCivilContents }
];

    button.onclick = () => openSubject(subject);
