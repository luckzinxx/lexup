// Flashcards button on home
(function() {
    const fcBtn = document.createElement("button");
    fcBtn.className = "content-btn subject-btn";
    fcBtn.innerHTML = `<span>FLASHCARDS<span class="arrow">→</span></span><small style="display:block;margin-top:7px;color:#9fb4a4;font-size:12px;font-weight:400;text-transform:none;letter-spacing:0">Direito Constitucional — ${flashcardDecks.constitucional.cards.length} cards</small>`;
    fcBtn.onclick = () => openFlashcards("constitucional");
    menu.appendChild(fcBtn);
})();

let fcDeck = null;
let fcIndex = 0;
let fcFlipped = false;
let fcOrder = [];

function openFlashcards(deckKey) {
    fcDeck = flashcardDecks[deckKey];
    if (!fcDeck) return;
    fcOrder = fcDeck.cards.map((_, i) => i);
    fcIndex = 0;
    fcFlipped = false;
    document.getElementById("fcTopic").textContent = "FLASHCARDS — " + fcDeck.name.toUpperCase();
    home.classList.add("hidden");
    subjectMenu.classList.add("hidden");
    quiz.classList.add("hidden");
    document.getElementById("flashcards").classList.remove("hidden");
    counter.classList.add("hidden");
    renderFlashcard();
    window.scrollTo({top:0, behavior:"smooth"});
}

function renderFlashcard() {
    const area = document.getElementById("fcArea");
    if (!fcDeck || !fcOrder.length) {
        area.innerHTML = "<p>Nenhum card.</p>";
        return;
    }
    const card = fcDeck.cards[fcOrder[fcIndex]];
    const sideClass = fcFlipped ? "fc-back" : "";
    const label = fcFlipped ? "RESPOSTA" : "PERGUNTA";
    const text = fcFlipped ? card.back : card.front;
    const hint = fcFlipped ? "Toque para ver a pergunta de novo" : "Toque no card para revelar a resposta";

    area.innerHTML = `
        <div class="fc-card ${sideClass}" id="fcCard">
            <div class="fc-label">${label}</div>
            <div class="fc-text">${text}</div>
            <div class="fc-hint">${hint}</div>
        </div>
        <div class="fc-nav">
            <button class="fc-btn" id="fcPrev" ${fcIndex === 0 ? "disabled" : ""}>← ANTERIOR</button>
            <button class="fc-btn primary" id="fcNext">${fcIndex === fcOrder.length - 1 ? "FIM DO BARALHO" : "PRÓXIMO →"}</button>
            <span class="fc-progress">${fcIndex + 1} / ${fcOrder.length}</span>
        </div>
    `;

    document.getElementById("fcCard").onclick = () => {
        fcFlipped = !fcFlipped;
        renderFlashcard();
    };
    document.getElementById("fcPrev").onclick = () => {
        if (fcIndex > 0) { fcIndex--; fcFlipped = false; renderFlashcard(); window.scrollTo({top:0,behavior:"smooth"}); }
    };
    document.getElementById("fcNext").onclick = () => {
        if (fcIndex < fcOrder.length - 1) {
            fcIndex++; fcFlipped = false; renderFlashcard(); window.scrollTo({top:0,behavior:"smooth"});
        } else {
            // end - go back to first or show message
            if (confirm("Fim do baralho! Recomeçar do início?")) {
                fcIndex = 0; fcFlipped = false; renderFlashcard();
            }
        }
    };
}

document.getElementById("fcBackBtn").onclick = () => {
    document.getElementById("flashcards").classList.add("hidden");
    home.classList.remove("hidden");
    counter.classList.add("hidden");
};
document.getElementById("fcShuffleBtn").onclick = () => {
    // Fisher-Yates
    for (let i = fcOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [fcOrder[i], fcOrder[j]] = [fcOrder[j], fcOrder[i]];
    }
    fcIndex = 0; fcFlipped = false; renderFlashcard();
};
document.getElementById("fcResetBtn").onclick = () => {
    fcOrder = fcDeck.cards.map((_, i) => i);
    fcIndex = 0; fcFlipped = false; renderFlashcard();
};


function openSubject(subject) {
    if (!subject.contents.length) {
        alert("Esta matéria ainda não possui questões cadastradas.");
        return;
    }
    subjectTitle.textContent = subject.name;
    blockMenu.innerHTML = "";
    subject.contents.forEach((content) => {
        const button = document.createElement("button");
        button.className = "content-btn";
        button.innerHTML = `${content.name}<span class="arrow">→</span><small style="display:block;margin-top:7px;color:#9fb4a4;font-size:12px;font-weight:400;text-transform:none;letter-spacing:0">${content.questions.length} questões${content.summary ? " · resumo teórico incluído" : ""}</small>`;
        button.onclick = () => startQuiz(content);
        blockMenu.appendChild(button);
    });
    home.classList.add("hidden");
    quiz.classList.add("hidden");
    subjectMenu.classList.remove("hidden");
    counter.classList.add("hidden");
}

function startQuiz(content) {
    if (typeof content === "number") content = contents[content];
    if (!content || !Array.isArray(content.questions)) return;
    currentContent = content;
    currentIndex = 0;
    answered = 0;
    correct = 0;
    mistakes = [];
    skipped = [];
    answerHistory = {}; // { index: { selected, isCorrect, chosenText, correctText } }

    subjectMenu.classList.add("hidden");
    home.classList.add("hidden");
    quiz.classList.remove("hidden");
    counter.classList.remove("hidden");
    topic.textContent = currentContent.name;
    updateCounter();
    renderQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
}

function updateCounter() {
    if (!currentContent) return;
    counter.textContent = `Respondidas ${answered}/${currentContent.questions.length} · Puladas ${skipped.length}`;
}

function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function renderQuestion() {
    const item = currentContent.questions[currentIndex];
    const already = answerHistory[currentIndex];

    // Keep stable order if already answered; otherwise shuffle
    if (already && already.optionsOrder) {
        currentOptions = already.optionsOrder;
        currentAnswer = currentOptions.findIndex(option => option.originalIndex === item.answer);
    } else {
        currentOptions = shuffleArray(item.options.map((text, originalIndex) => ({text, originalIndex})));
        currentAnswer = currentOptions.findIndex(option => option.originalIndex === item.answer);
    }

    const summaryHtml = currentContent.summary ? `
        <details class="study-summary">
            <summary>RESUMO TEÓRICO DO BLOCO</summary>
            <div class="summary-body">${currentContent.summary}</div>
        </details>` : "";

    questionArea.innerHTML = `
        ${summaryHtml}
        <div class="question-card">
            <div class="question-number">QUESTÃO ${currentIndex + 1} DE ${currentContent.questions.length}</div>
            <div class="statement">${item.q}</div>
            <div id="options"></div>
            <div id="feedback"></div>
            <div class="nav-buttons" id="navButtons"></div>
        </div>
    `;

    const options = document.getElementById("options");
    currentOptions.forEach((option, i) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerHTML = `<strong>${String.fromCharCode(65 + i)})</strong> ${option.text}`;
        if (already) {
            btn.disabled = true;
            if (i === already.selected) {
                btn.classList.add(already.isCorrect ? "correct" : "wrong");
            }
            if (i === currentAnswer) {
                btn.classList.add("correct");
            }
        } else {
            btn.onclick = () => answerQuestion(i);
        }
        options.appendChild(btn);
    });

    const feedback = document.getElementById("feedback");
    const nav = document.getElementById("navButtons");

    if (already) {
        feedback.className = already.isCorrect ? "feedback ok" : "feedback no";
        feedback.textContent = already.isCorrect ? "✓ Você acertou!" : "✗ Você errou. A alternativa correta está marcada em verde.";
        if (item.explanation) {
            const explanation = document.createElement("p");
            explanation.style.cssText = "font-weight:400;margin:10px 0 0;color:#d1dfd4";
            explanation.textContent = "Comentário: " + item.explanation;
            feedback.appendChild(explanation);
        }
        addNavButtons(nav, true);
    } else {
        const skipBtn = document.createElement("button");
        skipBtn.className = "skip";
        skipBtn.id = "skipBtn";
        skipBtn.type = "button";
        skipBtn.textContent = "PULAR QUESTÃO →";
        skipBtn.onclick = skipQuestion;
        nav.appendChild(skipBtn);

        // Always show previous if not first
        if (currentIndex > 0) {
            const prevBtn = document.createElement("button");
            prevBtn.className = "prev";
            prevBtn.textContent = "← ANTERIOR";
            prevBtn.onclick = goPrevQuestion;
            nav.insertBefore(prevBtn, skipBtn);
        }
    }
    updateCounter();
}

function answerQuestion(selected) {
    const item = currentContent.questions[currentIndex];
    const buttons = document.querySelectorAll("#options .option");
    if (!buttons.length || buttons[0].disabled) return;
    buttons.forEach(btn => btn.disabled = true);
    const skipBtn = document.getElementById("skipBtn");
    if (skipBtn) skipBtn.classList.add("hidden");

    const feedback = document.getElementById("feedback");
    const nav = document.getElementById("navButtons");
    const chosen = currentOptions[selected];
    const correctOption = currentOptions[currentAnswer];
    const isCorrect = selected === currentAnswer;

    if (isCorrect) {
        buttons[selected].classList.add("correct");
        correct++;
        feedback.className = "feedback ok";
        feedback.textContent = "✓ Você acertou!";
    } else {
        buttons[selected].classList.add("wrong");
        buttons[currentAnswer].classList.add("correct");
        feedback.className = "feedback no";
        feedback.textContent = "✗ Você errou. A alternativa correta está marcada em verde.";
        mistakes.push({
            number: currentIndex + 1,
            q: item.q,
            selectedLetter: String.fromCharCode(65 + selected),
            selectedText: chosen.text,
            correctLetter: String.fromCharCode(65 + currentAnswer),
            correctText: correctOption.text
        });
    }
    if (item.explanation) {
        const explanation = document.createElement("p");
        explanation.style.cssText = "font-weight:400;margin:10px 0 0;color:#d1dfd4";
        explanation.textContent = "Comentário: " + item.explanation;
        feedback.appendChild(explanation);
    }

    answerHistory[currentIndex] = {
        selected: selected,
        isCorrect: isCorrect,
        optionsOrder: currentOptions.slice()
    };

    answered++;
    updateCounter();
    addNavButtons(nav, true);
}

function addNavButtons(container, answeredNow) {
    if (!container) return;
    container.innerHTML = "";

    const isLast = currentIndex === currentContent.questions.length - 1;

    if (currentIndex > 0) {
        const prev = document.createElement("button");
        prev.className = "prev";
        prev.textContent = "← ANTERIOR";
        prev.onclick = goPrevQuestion;
        container.appendChild(prev);
    }

    const next = document.createElement("button");
    next.className = "next";
    next.textContent = isLast ? "VER RESULTADO" : "PRÓXIMA QUESTÃO →";
    next.onclick = () => {
        if (isLast) showResult();
        else { currentIndex++; renderQuestion(); window.scrollTo({top:0,behavior:"smooth"}); }
    };
    container.appendChild(next);
}

function goPrevQuestion() {
    if (currentIndex <= 0) return;
    currentIndex--;
    renderQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
}

function skipQuestion() {
    const item = currentContent.questions[currentIndex];
    const buttons = document.querySelectorAll("#options .option");
    if (buttons.length && buttons[0].disabled) return;
    skipped.push({number:currentIndex + 1, q:item.q});
    updateCounter();
    if (currentIndex < currentContent.questions.length - 1) {
        currentIndex++;
        renderQuestion();
        window.scrollTo({top:0,behavior:"smooth"});
    } else {
        showResult();
    }
}

function showResult() {
    const total = currentContent.questions.length;
    const percentage = Math.round((correct / total) * 100);
    let errorsHtml = "";
    if (mistakes.length) {
        errorsHtml = `<div class="errors"><h3>QUESTÕES ERRADAS (${mistakes.length})</h3>${mistakes.map(m => `
            <div class="error-item">
                <div class="error-q">QUESTÃO ${m.number}: ${m.q}</div>
                <div class="error-selected">Você marcou: ${m.selectedLetter}) ${m.selectedText}</div>
                <div class="error-correct">Correta: ${m.correctLetter}) ${m.correctText}</div>
            </div>`).join("")}</div>`;
    } else {
        errorsHtml = `<div class="empty-errors">Você não errou nenhuma das questões respondidas.</div>`;
    }
    let skippedHtml = "";
    if (skipped.length) {
        skippedHtml = `<div class="errors"><h3 style="color:#e8d98b">QUESTÕES PULADAS / NÃO RESPONDIDAS (${skipped.length})</h3>${skipped.map(m => `
            <div class="skipped-item"><b>QUESTÃO ${m.number}:</b> ${m.q}</div>`).join("")}</div>`;
    }

    questionArea.innerHTML = `
        <div class="question-card result">
            <div class="topic">BLOCO CONCLUÍDO</div>
            <h2>${currentContent.name}</h2>
            <div class="score">${correct}/${total}</div>
            <p>Você acertou ${percentage}% do total do bloco.</p>
            <div class="result-stats">
              <div class="stat"><strong>${correct}</strong><span>Corretas</span></div>
              <div class="stat"><strong>${mistakes.length}</strong><span>Erradas</span></div>
              <div class="stat"><strong>${skipped.length}</strong><span>Puladas</span></div>
              <div class="stat"><strong>${answered}</strong><span>Respondidas</span></div>
            </div>
            ${errorsHtml}
            ${skippedHtml}
            <button class="next" id="restartBtn">REFAZER BLOCO ↻</button>
            <button class="back" id="returnBtn">VOLTAR AOS BLOCOS</button>
        </div>
    `;
    document.getElementById("restartBtn").onclick = () => startQuiz(currentContent);
    document.getElementById("returnBtn").onclick = goBlockMenu;
    counter.classList.add("hidden");
    window.scrollTo({top:0,behavior:"smooth"});
}

function goBlockMenu() {
    quiz.classList.add("hidden");
    home.classList.add("hidden");
    subjectMenu.classList.remove("hidden");
    counter.classList.add("hidden");
}

function goHome() {
    quiz.classList.add("hidden");
    subjectMenu.classList.add("hidden");
    home.classList.remove("hidden");
    counter.classList.add("hidden");
}
</script>
</body>
</html>
